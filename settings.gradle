pluginManagement {
    repositories {
        // ModDevGradle lives here; the plugin portal's artifact host
        // (plugins-artifacts.gradle.org) keeps dropping TLS handshakes.
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

include "frontend"