import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

String buildNumber = System.getenv("GITHUB_ACTION_NUMBER")
version = "${mod_version}" + (buildNumber != null ? "-build.${System.getenv("GITHUB_RUN_NUMBER")}" : "")
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url 'https://maven.blamejared.com'
    }
    maven {
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url 'https://jitpack.io'
    }
    maven { url = "https://maven.firstdarkdev.xyz/snapshots" }
    exclusiveContent {
        forRepository { maven { url = "https://maven.tterrag.com/" } }
        forRepository {
            maven {
                name = "Ithundxr Maven"
                url = "https://maven.ithundxr.dev/snapshots"
            }
        }
        forRepository {
            maven {
                url = "https://maven.gegy.dev/releases"
            }
        }
        filter { includeGroup("com.tterrag.registrate") }
    }
}

base {
    archivesName = mod_id
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            devLogin = true

            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            jvmArgument("--add-opens=kotlinx.coroutines.core/kotlinx.coroutines.debug.internal=kotlin.stdlib")
            jvmArgument("-XX:+CreateCoredumpOnCrash")
            //jvmArgument("--add-opens kotlin.stdlib/kotlin.coroutines=kotlin.stdlib")
        }

        guide {
            client()
            systemProperties.putAll(
                    "guideDev.ae2guide.sources": file("src/main/resources/assets/appwebterminal/ae2guide").absolutePath,
                    "guideDev.ae2guide.startupPage": "appwebterminal:web_terminal.md"
            )
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDirs 'src/generated/resources', 'src/frontend'
}

sourceSets.main.kotlin.exclude 'icu/takeneko/appwebterminal/compat/**'

configurations {
    runtimeClasspath.extendsFrom localRuntime

    configureEach {
        resolutionStrategy {
            force "com.google.guava:guava:${libs.versions.guava.get()}"
            force "org.slf4j:slf4j-api:${libs.versions.slf4j.get()}"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

// Keep bundled libraries in the game layer so they can read Kotlin modules supplied by KFF.
def devLibrariesJar = tasks.register('devLibrariesJar', Jar) {
    dependsOn tasks.named('jarJar')
    archiveClassifier = 'dev-libraries'
    from tasks.named('jarJar')
    manifest {
        attributes 'FMLModType': 'GAMELIBRARY', 'Automatic-Module-Name': "${mod_id}.devlibraries"
    }
}

dependencies {
    runtimeOnly files(devLibrariesJar)
    api libs.registrate
    jarJar libs.registrate.get()

    implementation(libs.bundles.jei)
    implementation(libs.ae2)

    implementation(libs.kff)

    def list = List.of(
            libs.ktor.server.core,
            libs.ktor.server.websockets,
            libs.ktor.server.content.negotiation,
            libs.ktor.serialization.kotlinx.json,
            libs.ktor.server.forwarded.header,
            libs.ktor.server.cors,
            libs.ktor.server.caching.headers,
            libs.ktor.server.host.common,
            libs.ktor.server.auth,
            libs.ktor.server.cio
    )
    for (final def item in list) {
        implementation(item) {
            exclude group: 'org.jetbrains.kotlinx', module: 'kotlinx-serialization-core'
            exclude group: 'org.jetbrains.kotlinx', module: 'kotlinx-serialization-json'
        }
    }

    implementation(libs.pinin) { transitive = false }
    implementation(libs.ktor.server.auth.jwt) {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'org.jetbrains.kotlinx', module: 'kotlinx-serialization-core'
        exclude group: 'org.jetbrains.kotlinx', module: 'kotlinx-serialization-json'
    }

    def ktorModules = [
            'server-core',
            'server-websockets',
            'server-content-negotiation',
            'serialization-kotlinx-json',
            'server-forwarded-header',
            'server-cors',
            'server-caching-headers',
            'server-host-common',
            'server-auth',
            'server-cio',
            'server-auth-jwt',
            'utils',
            'io',
            'http',
            'serialization',
            'websockets',
            'events',
            'http-cio',
            'network',
            'websocket-serialization',
            'server-routing-openapi',
            'openapi-schema',
            'client-core',
            'sse',
            'server-csrf',
            'server-sessions',
            'server-auth-api-key',
            'serialization-kotlinx'
    ]
    def bundledLibraries = ktorModules.collect {
        "io.ktor:ktor-${it}-jvm:${libs.versions.ktor.version.get()}"
    } + [
            'com.github.Towdium:PinIn:1.6.0',
            'com.typesafe:config:1.4.9',
            'com.auth0:java-jwt:4.6.0',
            'com.auth0:jwks-rsa:0.24.1',
            'com.charleskorn.kaml:kaml-jvm:0.79.0',
            'it.krzeminski:snakeyaml-engine-kmp-jvm:3.1.1',
            'com.squareup.okio:okio-jvm:3.12.0',
            'net.thauvin.erik.urlencoder:urlencoder-lib-jvm:1.6.0',
            'org.jetbrains.kotlinx:kotlinx-datetime-jvm:0.8.0-0.6.x-compat',
            'org.jetbrains.kotlinx:kotlinx-io-core-jvm:0.9.1',
            'org.jetbrains.kotlinx:kotlinx-io-bytestring-jvm:0.9.1',
            'org.jetbrains.kotlinx:kotlinx-serialization-json-io-jvm:1.11.0',
            "com.fasterxml.jackson.core:jackson-core:${libs.jackson.core.get().versionConstraint.requiredVersion}",
            "com.fasterxml.jackson.core:jackson-annotations:${libs.jackson.annotations.get().versionConstraint.requiredVersion}",
            "com.fasterxml.jackson.core:jackson-databind:${libs.jackson.databind.get().versionConstraint.requiredVersion}"
    ]
    for (final def library in bundledLibraries) {
        jarJar(library)
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.register("deleteFrontend", Delete) {
    group = 'build'
    description = 'delete exists frontend files'
    delete 'src/frontend'
}

tasks.register("copyFrontendFile", Copy) {
    dependsOn(tasks.named('deleteFrontend'))
    dependsOn(project(":frontend").tasks.named('npmBuild'))
    group = 'build'
    description = 'build and copy dist to src/frontend/frontend'
    from "frontend/dist/"
    into "src/frontend/frontend"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
