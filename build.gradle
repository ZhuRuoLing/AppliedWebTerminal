plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

String buildNumber = System.getenv("GITHUB_ACTION_NUMBER")
version = "${mod_version}" + (buildNumber != null ? "-build.${System.getenv("GITHUB_RUN_NUMBER")}" : "")
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url 'https://maven.blamejared.com'
    }
    maven {
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url 'https://jitpack.io'
    }
    maven { url = "https://maven.firstdarkdev.xyz/snapshots" }
    exclusiveContent {
        forRepository { maven { url = "https://maven.tterrag.com/" } }
        forRepository {
            maven {
                name = "Ithundxr Maven"
                url = "https://maven.ithundxr.dev/snapshots"
            }
        }
        filter { includeGroup("com.tterrag.registrate") }
    }
}

base {
    archivesName = mod_id
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            devLogin = true

            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            jvmArgument("--add-opens=kotlinx.coroutines.core/kotlinx.coroutines.debug.internal=kotlin.stdlib")
            jvmArgument("-XX:+CreateCoredumpOnCrash")
            //jvmArgument("--add-opens kotlin.stdlib/kotlin.coroutines=kotlin.stdlib")
        }

        guide {
            client()
            systemProperties.putAll(
                    "guideDev.ae2guide.sources": file("src/main/resources/assets/appwebterminal/ae2guide").absolutePath,
                    "guideDev.ae2guide.startupPage": "appwebterminal:web_terminal.md"
            )
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDirs 'src/generated/resources', 'src/frontend'
}

sourceSets.main.kotlin.exclude 'icu/takeneko/appwebterminal/compat/**'

configurations {
    runtimeClasspath.extendsFrom localRuntime

    configureEach {
        resolutionStrategy {
            force "com.google.guava:guava:${libs.versions.guava.get()}"
            force "org.slf4j:slf4j-api:${libs.versions.slf4j.get()}"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


compileKotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    jarJar(api(libs.registrate.get()))
    implementation(libs.bundles.jei)
    implementation(libs.ae2)
    implementation(libs.ktor.server.core)
    implementation(libs.ktor.server.websockets)
    implementation(libs.ktor.server.content.negotiation)
    implementation(libs.ktor.serialization.kotlinx.json)
    implementation(libs.ktor.server.forwarded.header)
    implementation(libs.ktor.server.cors)
    implementation(libs.ktor.server.caching.headers)
    implementation(libs.ktor.server.host.common)
    implementation(libs.ktor.server.auth)
    implementation(libs.ktor.server.auth.jwt) {
        exclude group: 'com.fasterxml.jackson.core'
    }
    implementation(libs.ktor.server.cio)
    implementation(libs.pinin) { transitive = false }
    implementation(libs.kfflang)
    implementation(libs.kfflib)
    implementation(libs.kffmod)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.register("deleteFrontend", Delete) {
    group = 'build'
    description = 'delete exists frontend files'
    delete 'src/frontend'
}

tasks.register("copyFrontendFile", Copy) {
    dependsOn(tasks.named('deleteFrontend'))
    dependsOn(project(":frontend").tasks.named('npmBuild'))
    group = 'build'
    description = 'build and copy dist to src/frontend/frontend'
    from "frontend/dist/"
    into "src/frontend/frontend"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
